<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#021d3a" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Text Neon Glow Gradient -->
    <linearGradient id="h2tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadow Filter for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle Card -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Circuit Pattern Accents (Top & Bottom) -->
  <g stroke="#0284c7" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 120 h60 l30 30 h50" />
    <circle cx="210" cy="150" r="6" fill="#38bdf8" />
    
    <path d="M442 120 h-60 l-30 30 h-50" />
    <circle cx="302" cy="150" r="6" fill="#38bdf8" />

    <path d="M70 392 h70 l30 -30 h40" />
    <circle cx="210" cy="362" r="6" fill="#38bdf8" />

    <path d="M442 392 h-70 l-30 -30 h-40" />
    <circle cx="302" cy="362" r="6" fill="#38bdf8" />
  </g>

  <!-- Hardware Storage Grid Mini Pattern (Top Center) -->
  <g opacity="0.25" fill="#38bdf8">
    <rect x="236" y="70" width="16" height="12" rx="3" />
    <rect x="260" y="70" width="16" height="12" rx="3" />
    <rect x="236" y="90" width="16" height="12" rx="3" />
    <rect x="260" y="90" width="16" height="12" rx="3" />
  </g>

  <!-- Central "H2T" Typography with Cyber Circuit Cutouts -->
  <g filter="url(#neonGlow)">
    <!-- Main Bold Text H2T -->
    <text x="256" y="305" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" 
          font-size="168" 
          font-weight="900" 
          letter-spacing="-4" 
          fill="url(#h2tGrad)" 
          text-anchor="middle"
          stroke="#0f172a"
          stroke-width="4"
          paint-order="stroke fill">
      H2T
    </text>
  </g>

  <!-- Subtitle / Category Tag: INVENTORY -->
  <rect x="156" y="340" width="200" height="34" rx="17" fill="#0284c7" opacity="0.25" />
  <text x="256" y="363" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="18" 
        font-weight="800" 
        letter-spacing="6" 
        fill="#38bdf8" 
        text-anchor="middle">
    INVENTORY
  </text>
</svg>
